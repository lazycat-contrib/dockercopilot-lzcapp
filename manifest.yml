lzc-sdk-version: "0.1"
name: dockerCopilot
package: cloud.lazycat.app.docker-copilot
version: 2.1.1
description: 一个主打便捷的docker容器管理工具
homepage: https://github.com/onlyLTY/dockerCopilot
author: ll
application:
  subdomain: docker-copilot
  background_task: true
  multi_instance: false
  public_path:
    - /
  routes:
    - /=http://dockercopilot:12712/
services:
  dockercopilot:
    image: docker.1ms.run/0nlylty/dockercopilot:latest
    environment:
      - TZ=Asia/Shanghai
      - DOCKER_HOST=unix:///var/run/docker.sock
      - secretKey=lazycat666
    binds:
      - /lzcapp/var/data:/data
unsupported_platforms:
  - ios
  - android
  - tvos
